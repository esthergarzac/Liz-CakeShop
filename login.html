<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Iniciar sesión | Liz CakeShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login">
    <a class="logo" href="index.html" aria-label="Volver al sitio de Liz CakeShop">
      <img src="img/logo.png" alt="Liz CakeShop">
    </a>

    <section class="panel">
      <h1>Iniciar sesión</h1>

      <form id="form-login" novalidate>
        <label class="sr-only" for="usuario">Cuenta o usuario</label>
        <input id="usuario" name="usuario" type="text" inputmode="email" autocomplete="username"
               placeholder="Ingrese su cuenta o usuario" maxlength="200" required>

        <div class="campo-clave">
          <label class="sr-only" for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password"
                 placeholder="Ingrese su contraseña" maxlength="200" required>
          <button type="button" id="ver-clave" class="ojo" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg id="ojo-abierto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="ojo-cerrado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.5 10.5 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.5 6.6A17 17 0 0 0 2 12s3.6 7 10 7c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>

        <p id="login-error" class="error" role="alert" hidden></p>

        <button type="submit" id="btn-ingresar" class="btn-ingresar">INGRESAR</button>
      </form>

      <button type="button" id="btn-olvido" class="enlace">Olvidé mi contraseña</button>
      <p id="ayuda-olvido" class="ayuda" hidden>Para restablecer tu contraseña, pídele a la persona administradora que la actualice desde el panel de Usuarios.</p>
      <a class="enlace volver" href="index.html">← Volver al sitio</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
</body>
</html>
